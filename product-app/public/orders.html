<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/orders.css?v=1">
    <script src="https://kit.fontawesome.com/d9fb717134.js" crossorigin="anonymous"></script>
    <title>My Orders | PAPA J's Unli Samgy and Meat Shop</title>
    <link rel="stylesheet" href="../../shared/responsive.css?v=20261026">
    <script src="../../shared/nav.js?v=20261026" defer></script>
</head>
<body class="body-cart">
    <header>
        <div class="logo">
            <img class="haru-img" src="images/logoJs.png" alt="Papa J's Logo">
            <p class="logo-title">PAPA J's Unli Samgy and Meat Shop</p>
        </div>
        <div class="navbar">
            <nav>
                <ul>
                    <li><a href="../../landing/index.html">Home</a></li>
                    <li><a href="../../feature/index.html">Feature Page</a></li>
                    <li><a href="cart.html">Products</a></li>
                    <li><a href="../../contact/contact.html">Contacts</a></li>
                    <li><a href="../../login/login.html"><i class="fa-solid fa-right-to-bracket" style="color: #fff; font-size: 18px; padding-right: 5px; padding-left: 2px;"></i></a></li>
                </ul>
            </nav>
        </div>
    </header>
    <div class="header-content">
        <h1>My Orders</h1>
        <form class="orders-lookup" id="lookup-form" novalidate>
            <input type="tel" id="lookup-contact" placeholder="Contact number used when ordering" autocomplete="tel" maxlength="30" aria-label="Contact number used when ordering">
            <button type="submit" class="orders-find" id="lookup-btn">Find my orders</button>
        </form>
    </div>
    <div class="container orders-wrap" id="orders-results" aria-live="polite">
        <div class="orders-note">Enter the contact number you used at checkout to see your orders. Once an order is completed you can rate what you ordered.</div>
    </div>
    <footer>
        <p>&copy; Copyright 2024 PAPA J's Unli Samgy and Meat Shop </p>
    </footer>
    <script src="scripts/orders.js?v=1"></script>
</body>
</html>
